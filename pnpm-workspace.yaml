packages:
  - js-app/client
  - js-app/agent
  - js-app/webui
  - mock-server

catalog:
  '@biomejs/biome': ^2.5.11
  '@sap-cloud-sdk/generator': ^4.9.1
  '@sap-cloud-sdk/odata-v2': ^4.9.1
  '@sap-cloud-sdk/util': ^4.9.1
  tsx: ^4.23.12
  typescript: ^7.0.2


allowBuilds:
  esbuild: true
  workerd: false
blockExoticSubdeps: true
minimumReleaseAge: 5760
minimumReleaseAgeExclude:
  - '@sap-ai-sdk/*'
  - '@sap-cloud-sdk/*'
  # Add minimum age exceptions for audit issues here
  # - sample-package@0.1.0
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 131400 # 3 months
