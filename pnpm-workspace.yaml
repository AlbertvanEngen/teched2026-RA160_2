packages:
  - client/
  - mock-server/


allowBuilds:
  esbuild: true
blockExoticSubdeps: true
minimumReleaseAge: 5760
minimumReleaseAgeExclude:
  - '@sap-ai-sdk/*'
  - '@sap-cloud-sdk/*'
  # Add minimum age exceptions for audit issues here
  # - sample-package@0.1.0
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 131400 # 3 months
