name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@v2.1.0
        with:
          require-lockfile: true

      - name: Lint
        run: pnpm lint:ci

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@v2.1.0
        with:
          require-lockfile: true

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@v2.1.0
        with:
          require-lockfile: true

      - name: Test
        run: pnpm test

  java:
    name: Java compile
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: sapmachine
          java-version: "21"
          cache: maven
          cache-dependency-path: java-app/agent/pom.xml

      - name: Compile
        working-directory: java-app/agent
        run: ./mvnw --batch-mode --no-transfer-progress compile
